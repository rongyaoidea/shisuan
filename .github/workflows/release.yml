name: Release

# 触发：
#   - 推送 v* 标签 → 构建签名 APK 并创建 GitHub Release（附带 APK）
#   - 手动 workflow_dispatch → 仅构建并上传 artifact（验证 CI 链路，不发版）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          SHISUAN_KEYSTORE: ${{ env.KEYSTORE }}
          SHISUAN_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SHISUAN_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SHISUAN_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # 顺手跑一遍 JVM 单测（含 Robolectric 迁移测试），失败则不发版
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shisuan-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
